name: Update gold candles
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_ohlc.py
      - run: |
          git config user.name "kbtc-bot"
          git config user.email "kbtc-bot@users.noreply.github.com"
          git add ohlc.json
          git diff --cached --quiet || (git commit -m "Update gold candles" && git push)
