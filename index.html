<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1430">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>KBTC Gold Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060b1a; --bg2:#0a1430; --ink:#e9f0ff; --muted:#8a9ac0; --line:rgba(120,160,255,.16);
    --card:rgba(18,30,64,.62); --card2:rgba(28,44,92,.55);
    --blue:#3d7bff; --cyan:#29e3ff; --gold:#f5c542; --gold2:#ffdd7a; --done:#2ee6a6; --red:#ff5c7a; --violet:#8b5cff;
    --blue-soft:rgba(61,123,255,.16); --gold-soft:rgba(245,197,66,.14);
    --glow:0 0 0 1px rgba(41,227,255,.18), 0 10px 30px -10px rgba(41,227,255,.35);
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:"Kantumruy Pro",system-ui,sans-serif;line-height:1.45;min-height:100vh;background:transparent;overflow-x:hidden}
  /* ---------- animated 3D background ---------- */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 600px at 80% -10%,#16306e 0%,transparent 60%),radial-gradient(900px 500px at -10% 20%,#2a1460 0%,transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg) 60%)}
  .grid3d{position:absolute;left:-50%;right:-50%;bottom:-14%;height:76%;transform:perspective(520px) rotateX(62deg);transform-origin:50% 100%;
    background-image:linear-gradient(rgba(41,227,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(41,227,255,.22) 1px,transparent 1px);background-size:56px 56px;
    mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 85%);-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 85%);animation:gridmove 6s linear infinite;will-change:transform}
  @keyframes gridmove{from{transform:perspective(520px) rotateX(62deg) translateY(0)}to{transform:perspective(520px) rotateX(62deg) translateY(56px)}}
  .orb{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform;opacity:.45;animation:float 14s ease-in-out infinite}
  .o1{width:340px;height:340px;background:#1f5cff;top:8%;right:-80px}
  .o2{width:280px;height:280px;background:#b8860b;top:46%;left:-90px;animation-delay:-6s;opacity:.32}
  @keyframes float{50%{transform:translate(30px,-40px) scale(1.08)}}
  .stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#9cf8,transparent),radial-gradient(1px 1px at 85% 60%,#fff5,transparent),radial-gradient(1px 1px at 10% 80%,#fff5,transparent);animation:twinkle 5s ease-in-out infinite alternate}
  @keyframes twinkle{to{opacity:.4}}
  @media (prefers-reduced-motion:reduce){.grid3d,.orb,.stars{animation:none}}
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 70px}
  /* ---------- header / HUD ---------- */
  header{position:relative;border-radius:24px;padding:18px 18px 16px;margin-bottom:14px;background:linear-gradient(145deg,rgba(30,60,140,.75),rgba(10,20,50,.85));
    border:1px solid rgba(41,227,255,.28);box-shadow:0 20px 50px -18px rgba(41,140,255,.6),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(14px);overflow:hidden}
  header::before{content:"";position:absolute;inset:-40% -10% auto auto;width:260px;height:260px;background:conic-gradient(from 0deg,transparent,rgba(41,227,255,.35),transparent 30%);border-radius:50%;animation:spin 9s linear infinite;opacity:.6}
  @keyframes spin{to{transform:rotate(360deg)}}
  header::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--gold),transparent);animation:scan 4s linear infinite}
  @keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .topline{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .hello{font-size:14px;color:#bcd0ff}
  header h1{position:relative;margin:4px 0 2px;font-size:26px;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#9fe9ff 60%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .date{position:relative;font-size:14px;font-weight:600;color:#cfe0ff}
  .hud{position:relative;display:flex;align-items:center;gap:16px;margin-top:14px}
  .ring{position:relative;width:104px;height:104px;flex:none;filter:drop-shadow(0 0 14px rgba(41,227,255,.45))}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bgc{fill:none;stroke:rgba(255,255,255,.1);stroke-width:10}
  .ring .fg{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:24px;line-height:1}
  .ring .pct small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:3px}
  .hudstats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hs{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:8px 10px;transform:translateZ(0)}
  .hs .k{font-size:11px;color:var(--muted)}
  .hs .v{font-size:18px;font-weight:700}
  .hs.fire .v{color:#ffb86b;text-shadow:0 0 12px rgba(255,140,60,.6)}
  .hs.lvl .v{color:var(--gold2);text-shadow:0 0 12px rgba(245,197,66,.5)}
  .hs.full{grid-column:1/-1}
  .xpbar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
  .xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff1b0);box-shadow:0 0 10px var(--gold);transition:width .6s}
  .quote{position:relative;margin-top:12px;font-size:13px;color:#d6e3ff;padding:9px 12px;border-left:3px solid var(--gold);background:rgba(255,255,255,.05);border-radius:0 12px 12px 0}
  .bar,.stats{display:none}
  .langs{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:99px;padding:3px}
  .langs button{border:0;background:none;color:#cfe0ff;font:inherit;font-size:13px;padding:4px 11px;border-radius:99px;cursor:pointer}
  .langs button.on{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04122e;font-weight:700;box-shadow:0 0 14px rgba(41,227,255,.6)}
  /* ---------- reminder ---------- */
  .remind{background:linear-gradient(135deg,rgba(245,197,66,.16),rgba(245,197,66,.05));border:1px solid rgba(245,197,66,.45);color:var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;box-shadow:0 10px 30px -14px rgba(245,197,66,.5)}
  .remind b{color:var(--gold2)}
  .remind.ok,.remind.rest{background:linear-gradient(135deg,rgba(46,230,166,.18),rgba(46,230,166,.05));border-color:rgba(46,230,166,.5);box-shadow:0 10px 30px -14px rgba(46,230,166,.5)}
  /* ---------- tabs ---------- */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .tabs button{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:12px 8px;border-radius:16px;cursor:pointer;transition:transform .15s,box-shadow .2s}
  .tabs button:hover{transform:translateY(-2px);box-shadow:var(--glow)}
  .tabs button.on{background:linear-gradient(135deg,#2a6bff,#173a9e);border-color:rgba(41,227,255,.6);box-shadow:0 8px 24px -8px rgba(61,123,255,.8),inset 0 1px 0 rgba(255,255,255,.25)}
  .tabs em{font-style:normal;font-size:11px;font-weight:700;background:var(--gold);color:#2a1d00;border-radius:99px;padding:1px 7px;margin-left:4px}
  @media (max-width:420px){.tabs button{font-size:12.5px;padding:11px 4px}}
  /* ---------- cards ---------- */
  .group{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);transition:transform .25s,box-shadow .25s}
  .group:hover{transform:translateY(-2px);box-shadow:0 24px 50px -22px rgba(41,140,255,.45),inset 0 1px 0 rgba(255,255,255,.1)}
  .group h2{margin:0;padding:13px 16px;font-size:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);
    background:linear-gradient(90deg,rgba(61,123,255,.18),transparent)}
  .group h2 span{font-size:12px;color:var(--muted);font-weight:400}
  .group h2 span[data-t]{font-size:inherit;color:inherit;font-weight:inherit}
  .gprog{height:3px;background:rgba(255,255,255,.06)}
  .gprog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));box-shadow:0 0 8px var(--cyan);transition:width .5s}
  .item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;transition:background .15s}
  .item:last-child{border-bottom:0}
  .item:hover{background:rgba(61,123,255,.1)}
  .box{flex:none;width:26px;height:26px;border:2px solid var(--cyan);border-radius:9px;display:grid;place-items:center;margin-top:1px;transition:.2s;box-shadow:0 0 10px rgba(41,227,255,.35),inset 0 0 8px rgba(41,227,255,.2)}
  .item.done .box{background:linear-gradient(135deg,var(--done),#13b985);border-color:var(--done);box-shadow:0 0 16px rgba(46,230,166,.8);animation:pop .35s}
  @keyframes pop{50%{transform:scale(1.25)}}
  .item.done .box::after{content:"";width:6px;height:11px;border:solid #04201a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .num{color:var(--cyan);font-size:12px;min-width:34px;font-weight:600;opacity:.8;margin-top:3px}
  .txt{flex:1}
  .item.done .txt{text-decoration:line-through;color:var(--muted)}
  .item.paused{opacity:.5}
  .item.paused .box{border-style:dashed;border-color:var(--muted);box-shadow:none}
  .ptag{display:inline-block;font-size:11px;font-weight:700;color:#ffcf6b;background:rgba(255,190,60,.14);border:1px solid rgba(255,190,60,.4);border-radius:99px;padding:0 8px;margin-left:6px;vertical-align:1px}
  .acts{display:flex;gap:2px;flex:none}
  .acts button{border:0;background:rgba(255,255,255,.05);color:var(--muted);font-size:14px;cursor:pointer;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;transition:.15s}
  .acts button:hover{background:rgba(61,123,255,.25);color:#fff}
  .acts .del:hover,.acts .del.arm{background:rgba(255,92,122,.25);color:var(--red)}
  .acts .del.arm{width:auto;padding:0 8px;font-size:12px;font-weight:700}
  .acts .pz.on{color:#ffcf6b}
  .add,.nt{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .nt{flex-direction:column;border-top:0;padding:12px 16px}
  input,select{border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);border-radius:12px;padding:9px 11px;font:inherit;font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(41,227,255,.2)}
  input[type=date]{color-scheme:dark}
  .add input{flex:1}
  .add button,.btn{border:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04122e;font-weight:700;border-radius:12px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;box-shadow:0 6px 18px -6px rgba(41,227,255,.8)}
  .add button,.btn{font-weight:700}
  .nt input{width:100%}
  .nt-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .nt-row > input{flex:1;min-width:140px}
  .nt-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .nt-row label input{width:auto}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:12px}
  .tag{background:var(--blue-soft);color:#9cc0ff;border-radius:99px;padding:1px 9px}
  .tag.due{background:var(--gold-soft);color:var(--gold2)}
  .tag.over{background:rgba(255,92,122,.16);color:var(--red)}
  .empty{padding:14px 16px;color:var(--muted);font-size:14px}
  .link{border:0;background:none;color:var(--cyan);font:inherit;font-size:12px;cursor:pointer}
  /* ---------- day off ---------- */
  .offbtn{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;color:#04201a;padding:11px 18px;border-radius:14px;
    background:linear-gradient(135deg,#5dffc4,#16c08a);box-shadow:0 8px 20px -8px rgba(46,230,166,.8),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s}
  .offbtn:hover{transform:translateY(-2px)}
  .offbtn.cancel{background:linear-gradient(135deg,#ffd479,#f5a524);color:#2a1700;box-shadow:0 8px 20px -8px rgba(245,165,36,.8)}
  .offbtn.small{font-size:13px;padding:8px 12px;flex:none}
  .mpanel{position:fixed;top:64px;right:max(14px,calc(50% - 366px));z-index:60;width:270px;padding:12px;border-radius:18px;background:rgba(10,18,44,.94);border:1px solid rgba(41,227,255,.35);box-shadow:0 24px 50px -16px rgba(0,0,0,.8);backdrop-filter:blur(16px);color:#e9f0ff}
  .mp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
  .mp-off{border:1px solid rgba(255,255,255,.2);background:none;color:#cfe0ff;font:inherit;font-size:12px;padding:4px 10px;border-radius:99px;cursor:pointer}
  .mp-list{display:grid;gap:6px}
  .mp-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#e9f0ff;font:inherit;font-size:14px;padding:9px 11px;border-radius:12px;cursor:pointer}
  .mp-list button span{font-size:18px}
  .mp-list button:hover{background:rgba(61,123,255,.25)}
  .mp-list button.on{background:linear-gradient(135deg,rgba(41,227,255,.35),rgba(61,123,255,.35));border-color:rgba(41,227,255,.7)}
  .eq{margin-left:auto;display:flex;gap:2px;align-items:flex-end;height:14px}
  .eq b{width:3px;background:#29e3ff;animation:eq 0.9s ease-in-out infinite}
  .eq b:nth-child(2){animation-delay:-.3s} .eq b:nth-child(3){animation-delay:-.6s}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}
  .mp-vol{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:#8a9ac0}
  .mp-vol input{flex:1;accent-color:#29e3ff;padding:0;border:0;background:none}
  html[data-theme=light] .mpanel{background:rgba(255,255,255,.97);color:#13203d;border-color:rgba(61,123,255,.25)}
  html[data-theme=light] .mp-list button{background:#f2f6ff;color:#13203d;border-color:rgba(61,123,255,.12)}
  html[data-theme=light] .mp-list button.on{background:linear-gradient(135deg,#dbe8ff,#cbeffd);border-color:#2a6bff}
  html[data-theme=light] .mp-off{color:#3a4f7d;border-color:rgba(61,123,255,.3)}
  .hdrow{position:relative;display:flex;gap:10px;align-items:stretch;margin-top:12px}
  .hdrow .quote{margin-top:0;flex:1}
  .themebtn.off{opacity:.45}
  .tright{flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:430px){ .themebtn{width:30px;height:30px;font-size:14px} .langs button{padding:4px 8px} }
  .offbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:12px;font-size:13px}
  .offbar.on{justify-content:space-between;background:linear-gradient(135deg,rgba(46,230,166,.18),rgba(46,230,166,.04));border:1px solid rgba(46,230,166,.5);border-radius:16px;padding:12px 14px;font-size:15px;font-weight:600}
  .offbar.on .sub{display:block;font-size:12px;font-weight:400;color:var(--muted)}
  #groups.off .item{cursor:not-allowed;opacity:.4}
  /* ---------- week chart ---------- */
  .week{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
  .week h2{margin:0 0 10px;font-size:16px}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
  .days .col{display:flex;flex-direction:column;align-items:center;gap:4px}
  .days .tower{width:100%;max-width:34px;height:70px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
  .days .tower i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--gold2),#b8860b);box-shadow:0 0 12px rgba(245,197,66,.6)}
  .days .today .tower{border-color:var(--cyan);box-shadow:0 0 12px rgba(41,227,255,.5)}
  .days .col.offday .tower{background:repeating-linear-gradient(45deg,rgba(255,255,255,.08),rgba(255,255,255,.08) 4px,transparent 4px,transparent 8px)}
  .foot{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
  .saving{position:fixed;right:14px;bottom:14px;background:linear-gradient(135deg,var(--done),#13b985);color:#04201a;font-weight:700;font-size:12px;padding:7px 12px;border-radius:99px;opacity:0;transition:.2s;box-shadow:0 0 20px rgba(46,230,166,.6)}
  .saving.show{opacity:1}
  /* ---------- gold ---------- */
  .goldcard{border-color:rgba(245,197,66,.45)}
  .gc-top{padding:16px;background:linear-gradient(135deg,rgba(245,197,66,.14),rgba(61,123,255,.1))}
  .gc-label{font-size:13px;color:var(--muted)}
  .gc-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .refbtn{border:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04122e;font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:12px;cursor:pointer;box-shadow:0 6px 16px -6px rgba(41,227,255,.8);flex:none}
  .refbtn.spin{opacity:.7}
  html[data-theme=light] .refbtn{color:#fff;background:linear-gradient(135deg,#2a6bff,#173a9e)}
  .gc-price{font-size:22px;font-weight:700}
  .gc-chg{font-size:14px;font-weight:700;margin-top:2px}
  .gc-chg.up{color:var(--done)} .gc-chg.down{color:var(--red)}
  .gc-asof{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
  .gc-asof a{color:var(--cyan)}
  .chip{display:inline-block;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--ink)}
  .gc-closed{margin-top:8px;font-size:12px;background:rgba(0,0,0,.25);border:1px dashed var(--gold);border-radius:10px;padding:6px 9px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;perspective:900px}
  .tile{border-radius:18px;padding:14px 14px 12px;background:linear-gradient(160deg,rgba(40,60,120,.7),rgba(12,22,52,.9));border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;
    box-shadow:0 14px 30px -16px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .25s}
  .tile:hover{transform:rotateX(6deg) rotateY(-4deg) translateY(-3px)}
  .tile.wide{grid-column:1/-1}
  .tile.main{grid-column:1/-1;background:linear-gradient(135deg,#0d2a7a,#1847c9 55%,#b8860b);border:1px solid rgba(245,197,66,.6);box-shadow:0 20px 40px -14px rgba(245,197,66,.45),inset 0 1px 0 rgba(255,255,255,.25)}
  .tile .tu{font-size:18px;font-weight:700}
  .tile .tg{font-size:12px;color:var(--muted)}
  .tile.main .tg{color:rgba(255,255,255,.75)}
  .tile .tp{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-top:6px;line-height:1.1;color:var(--gold2);text-shadow:0 0 18px rgba(245,197,66,.45)}
  .tile.main .tp{font-size:42px;color:#fff;text-shadow:0 0 22px rgba(255,221,122,.7)}
  .tile .tp small{font-size:14px;font-weight:600;opacity:.7;margin-right:2px}
  @media (max-width:380px){ .tile .tp{font-size:23px} .tile.main .tp{font-size:34px} }
  .gc-note{font-size:12px;color:var(--muted);padding:10px 16px}
  .hint{font-size:13px;color:var(--muted)}
  .calc-out{font-weight:700;font-size:17px;margin-left:auto;color:var(--gold2)}
  .qlinks{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;padding:4px 4px 10px}
  .qlinks a{color:var(--cyan)}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:50}

  /* ---------- illustrations & icons ---------- */
  .hero{position:absolute;right:-6px;top:44px;width:150px;height:118px;opacity:.95;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
  .hero .c-up{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  @media (max-width:430px){.hero{width:112px;height:90px;top:96px;right:-10px;opacity:.55}}
  .gtitle{display:flex;align-items:center;gap:10px;font-weight:700}
  .gic{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(61,123,255,.35),rgba(41,227,255,.12));border:1px solid rgba(41,227,255,.35);box-shadow:0 6px 14px -6px rgba(41,227,255,.7),inset 0 1px 0 rgba(255,255,255,.25)}
  .gic svg{width:22px;height:22px}
  .pane-hero{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
  .pane-hero svg{width:92px;height:72px;flex:none}
  .pane-hero b{display:block;font-size:16px}
  .pane-hero span{font-size:13px;color:var(--muted)}
  .gold-ill{position:absolute;right:10px;top:10px;width:120px;height:86px;opacity:.95;pointer-events:none}
  .gc-top{position:relative}
  .themebtn{border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;display:grid;place-items:center;flex:none}
  .tright{display:flex;gap:8px;align-items:center}
  .tile.img{position:relative;overflow:hidden;background-size:cover !important;background-position:center !important;border:1px solid rgba(245,197,66,.45) !important}
  .tile.img .tu,.tile.img .tg{color:#fff !important;text-shadow:0 1px 6px rgba(0,0,0,.7)}
  .tile.img .tg{color:rgba(255,255,255,.8) !important}
  .tile.img .tp{color:#ffe08a !important;text-shadow:0 0 18px rgba(245,197,66,.6),0 2px 8px rgba(0,0,0,.6) !important}
  .tile.img.main .tp{color:#fff !important}

  .tfbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
  .tfbar button{border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:10px;cursor:pointer}
  .tfbar button.on{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04122e;border-color:transparent;box-shadow:0 0 12px rgba(41,227,255,.5)}
  html[data-theme=light] .tfbar button{background:#fff}
  html[data-theme=light] .tfbar button.on{color:#fff;background:linear-gradient(135deg,#2a6bff,#173a9e)}
  .tf-live{margin:14px;padding:16px;border-radius:16px;border:1px dashed var(--cyan);text-align:center;font-size:14px}
  .tf-live a{display:inline-block;margin-top:10px;padding:9px 16px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04122e;font-weight:700;text-decoration:none}
  html[data-theme=light] .tf-live a{color:#fff;background:linear-gradient(135deg,#2a6bff,#173a9e)}
  .imp{padding:4px 16px 14px;display:flex;flex-direction:column;gap:6px}
  .impbtn{align-self:flex-start;cursor:pointer;font-weight:700;font-size:13px;padding:9px 14px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),#b8860b);color:#2a1d00;box-shadow:0 6px 16px -6px rgba(245,197,66,.7)}
  .impmsg{font-size:13px;font-weight:700}
  .impmsg.ok{color:var(--done)} .impmsg.err{color:var(--red)}
  .covsum{padding:10px 16px 0;font-size:14px;font-weight:600;display:grid;gap:4px}
  .covsum .ok{color:var(--done)} .covsum .bad{color:#ffb86b}
  html[data-theme=light] .covsum .bad{color:#c25e00}
  .cov .ch .lu{display:block;font-family:"Kantumruy Pro",sans-serif;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
  .cov .ch .ic{display:block;font-size:13px;line-height:1.1;min-height:14px}
  .cov .ch.sila .lu{color:#f5c542}
  .cov .ch.hol{color:#ff7a90}
  html[data-theme=light] .cov .ch.sila .lu{color:#a77400}
  html[data-theme=light] .cov .ch.hol{color:#d6334f}
  .cov .cell.holc{border-color:rgba(255,122,144,.75)}
  .khcal{padding:0 14px 14px;display:grid;gap:6px}
  .khcal .kt{font-weight:700;font-size:13.5px;color:var(--muted)}
  .khcal .kt b{color:var(--ink);font-family:"Kantumruy Pro",sans-serif}
  .khrow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.16);border:1px solid var(--line);font-size:13.5px}
  html[data-theme=light] .khrow{background:#fff}
  .khrow.past{opacity:.5}
  .khrow .kd{flex:none;width:86px;font-weight:700}

let lang=ls("kgl_lang")||"km", price=0, first=0, prev=0, at="", ok=true, tf=ls("kgl_tf")||"15", chartOn=false;
const $=id=>document.getElementById(id), L=k=>T[lang][k];
const fmt=(v,d=2)=>v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
document.documentElement.dataset.theme=ls("kgl_theme")||"dark";
function paint(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=L(e.dataset.t));
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $("themeBtn").textContent=document.documentElement.dataset.theme==="light"?"🌙":"☀️";
  $("liveTxt").textContent=ok?L("live"):L("err"); $("dot").classList.toggle("err",!ok);
  if(!price) return;
  const p=$("gPrice"); p.textContent="$"+fmt(price); p.className="gc-price big"+(price>prev?" up":price<prev?" down":"");
  const d=price-first, pc=first?d/first*100:0;
  $("gChg").className="gc-chg "+(d>=0?"up":"down"); $("gChg").textContent=(d>=0?"▲ +":"▼ ")+fmt(d)+" ("+pc.toFixed(2)+"%) · "+L("open");
  $("gAsof").textContent="🕒 "+L("upd")+": "+new Intl.DateTimeFormat("en-GB",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(at?new Date(at):new Date())+" (Cambodia)";
  $("gUnits").innerHTML=["kg","dam","oz","ji"].map(k=>'<div class="tile img t-'+k+(k==="kg"?" main":k==="ji"?" wide":"")+'"><div class="tu">1 '+L("u_"+k)+'</div><div class="tg">'+U[k].toLocaleString("en-US",{maximumFractionDigits:4})+' g</div><div class="tp"><small>$</small>'+fmt(price/OZ*U[k])+'</div></div>').join("");
}
let busy=false;
async function tick(){
  if(busy) return; busy=true;
  try{ const r=await fetch("https://api.gold-api.com/price/XAU",{cache:"no-store"}); if(!r.ok) throw 0; const j=await r.json(); if(!(j.price>0)) throw 0;
    prev=price||j.price; price=j.price; if(!first) first=price; at=j.updatedAt||""; ok=true; ls("kgl_last",JSON.stringify({p:price,at}));
  }catch(e){ ok=false; } busy=false; paint();
}
function tfbar(){ $("tfBar").innerHTML=[["1","1m"],["15","15m"],["60","1H"],["240","4H"],["D","1D"],["W","1W"]].map(([v,n])=>'<button data-tf="'+v+'" class="'+(v===tf?"on":"")+'">'+n+'</button>').join(""); }
function chart(){
  chartOn=true; tfbar(); $("tv").classList.add("on"); $("tv").innerHTML='<div id="tvc" style="height:100%"></div>';
  const go=()=>new TradingView.widget({container_id:"tvc",autosize:true,symbol:"PEPPERSTONE:XAUUSD",interval:tf,timezone:TZ,theme:document.documentElement.dataset.theme==="light"?"light":"dark",style:"1",locale:"en",allow_symbol_change:true});
  if(window.TradingView) return go();
  const s=document.createElement("script"); s.src="https://s3.tradingview.com/tv.js"; s.onload=go; document.head.appendChild(s);
}
$("loadChart").onclick=()=>{ ls("kgl_chart","1"); chart(); };
$("tfBar").onclick=e=>{ const b=e.target.closest("[data-tf]"); if(!b) return; tf=b.dataset.tf; ls("kgl_tf",tf); chart(); };
$("langs").onclick=e=>{ const b=e.target.closest("[data-l]"); if(!b) return; lang=b.dataset.l; ls("kgl_lang",lang); paint(); };
$("themeBtn").onclick=()=>{ const n=document.documentElement.dataset.theme==="light"?"dark":"light"; document.documentElement.dataset.theme=n; ls("kgl_theme",n); paint(); if(chartOn) chart(); };
$("refBtn").onclick=tick;
$("copyBtn").onclick=async()=>{
  if(!price) return; const txt="KBTCGOLD|"+price.toFixed(2)+"|"+(at||new Date().toISOString());
  let ok=false; try{ await navigator.clipboard.writeText(txt); ok=true; }catch(_){}
  if(!ok){ const t=document.createElement("textarea"); t.value=txt; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); try{ ok=document.execCommand("copy"); }catch(_){} t.remove(); }
  $("copyMsg").textContent=ok?L("copied").replace("{p}","$"+fmt(price)):txt;
};
try{ const c=JSON.parse(ls("kgl_last")||"null"); if(c&&c.p){ price=prev=first=c.p; at=c.at; } }catch(_){}
paint(); tick(); setInterval(()=>{ if(!document.hidden) tick(); },10000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });
if(ls("kgl_chart")==="1") setTimeout(chart,300);
}
</script>
</body>
</html>
